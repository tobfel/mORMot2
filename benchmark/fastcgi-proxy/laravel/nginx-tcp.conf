worker_processes 3;
pid /srv/bench/run/nginx-tcp.pid;
error_log /srv/bench/run/nginx-tcp-error.log warn;
events { worker_connections 8192; }
http {
  access_log off;
  upstream fpm_keep { server 127.0.0.1:9000; keepalive 4; }
  server {
    listen 8083; root /srv/laravel/app/public;
    location / { try_files $uri /index.php?$query_string; }
    location ~ \.php$ { include /etc/nginx/fastcgi_params; fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name; fastcgi_pass 127.0.0.1:9000; }
  }
  server {
    listen 8084; root /srv/laravel/app/public;
    location / { try_files $uri /index.php?$query_string; }
    location ~ \.php$ { include /etc/nginx/fastcgi_params; fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name; fastcgi_keep_conn on; fastcgi_pass fpm_keep; }
  }
}
